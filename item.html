<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アイテムせんたく - うでずもう</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    font-family: 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #333;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }

  /* 画面共通スタイル */
  .screen {
    display: none;
    width: 95%;
    max-width: 950px;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 32px;
    padding: 35px 25px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.14);
    text-align: center;
    animation: fadeIn 0.35s ease;
  }
  .active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }

  .badge {
    display: inline-block;
    background: #f59e0b;
    color: white;
    font-size: 1.8rem;
    font-weight: bold;
    padding: 8px 36px;
    border-radius: 50px;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }

  h1 {
    font-size: 2.3rem;
    color: #b45309;
    margin: 0 0 25px 0;
  }

  /* アイテムカード3つ並び */
  .card-container {
    display: flex;
    gap: 20px;
    justify-content: center;
    width: 100%;
    margin-bottom: 30px;
  }

  .item-card {
    flex: 1;
    background: #fff;
    border: 5px solid #e2e8f0;
    border-radius: 24px;
    padding: 20px 10px;
    cursor: pointer;
    box-shadow: 0 8px 16px rgba(0,0,0,0.06);
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .item-card.selected {
    border-color: #ef4444;
    background: #fef2f2;
    transform: scale(1.05);
    box-shadow: 0 14px 28px rgba(239, 68, 68, 0.25);
  }

  /* 選択画面の画像枠 */
  .image-wrapper {
    width: 100%;
    height: 180px;
    background: #f8fafc;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 16px;
    border: 2px dashed #cbd5e1;
  }

  .image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .placeholder-icon {
    font-size: 5rem;
  }

  .item-label {
    font-size: 1.8rem;
    font-weight: bold;
    color: #1f2937;
    line-height: 1.3;
  }

  .item-desc {
    font-size: 1.15rem;
    color: #64748b;
    margin-top: 6px;
  }

  /* 決定ボタン */
  .next-btn {
    display: none;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
    font-size: 2.1rem;
    font-weight: bold;
    padding: 18px 65px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
    margin: 0 auto;
    animation: popIn 0.3s ease;
  }
  .next-btn:active { transform: scale(0.96); }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  /* -------------------------------
     うでずもうスタート画面スタイル
  ------------------------------- */
  .battle-screen {
    border: 6px solid #ef4444;
    background: linear-gradient(180deg, #ffffff 0%, #fff5f5 100%);
  }

  .battle-title {
    font-size: 3.4rem;
    font-weight: 900;
    color: #dc2626;
    letter-spacing: 3px;
    margin: 10px 0 20px 0;
    text-shadow: 2px 2px 0px #fecaca;
    animation: pulse 1s infinite alternate;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.03); }
  }

  /* スタート画面の選択アイテム表示枠（画像を大きく表示） */
  .item-activated-box {
    background: #fef3c7;
    border: 4px solid #f59e0b;
    border-radius: 28px;
    padding: 20px 30px;
    margin: 15px auto 25px auto;
    max-width: 700px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    box-shadow: 0 8px 20px rgba(245, 158, 11, 0.15);
  }

  /* スタート画面用画像枠 */
  .battle-image-wrapper {
    width: 170px;
    height: 170px;
    background: #ffffff;
    border-radius: 20px;
    border: 3px solid #f59e0b;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  }

  .battle-image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .battle-placeholder-icon {
    font-size: 5rem;
  }

  .activated-text {
    text-align: left;
  }

  .activated-badge {
    display: inline-block;
    background: #ea580c;
    color: white;
    font-size: 1.1rem;
    font-weight: bold;
    padding: 3px 14px;
    border-radius: 20px;
    margin-bottom: 6px;
  }

  .activated-name {
    font-size: 2.3rem;
    font-weight: 900;
    color: #b45309;
    line-height: 1.2;
  }

  .activated-desc {
    font-size: 1.45rem;
    color: #374151;
    font-weight: bold;
    margin-top: 8px;
  }

  .start-cue {
    font-size: 2.3rem;
    font-weight: 900;
    color: #1d4ed8;
    margin: 20px 0 15px 0;
  }

  .btn-back {
    background: #94a3b8;
    color: white;
    font-size: 1.4rem;
    font-weight: bold;
    padding: 12px 35px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-back:active { transform: scale(0.96); }
</style>
</head>
<body>

  <!-- ================= 画面1: アイテム選択 ================= -->
  <div id="screen-select" class="screen active">
    <div class="badge">アイテム</div>
    <h1>かつためのアイテムを えらぼう！</h1>

    <div class="card-container">
      <!-- カード1: 3びょうていし -->
      <div class="item-card" onclick="selectItem(0)">
        <div class="image-wrapper" id="card-img-wrap-0">
          <!-- JSで画像またはプレースホルダーがセットされます -->
        </div>
        <div class="item-label">3びょうていし</div>
        <div class="item-desc">せんせいは 3びょう うごけない！</div>
      </div>

      <!-- カード2: ひとさし指だけ -->
      <div class="item-card" onclick="selectItem(1)">
        <div class="image-wrapper" id="card-img-wrap-1">
          <!-- JSで画像またはプレースホルダーがセットされます -->
        </div>
        <div class="item-label">ひとさし指だけ</div>
        <div class="item-desc">せんせいは ゆび1ぽんで しょうぶ！</div>
      </div>

      <!-- カード3: スタートいちへんこう -->
      <div class="item-card" onclick="selectItem(2)">
        <div class="image-wrapper" id="card-img-wrap-2">
          <!-- JSで画像またはプレースホルダーがセットされます -->
        </div>
        <div class="item-label">スタートいち<br>へんこう</div>
        <div class="item-desc">Aくんが ゆうりな たおれぐあい！</div>
      </div>
    </div>

    <!-- 決定ボタン -->
    <button id="start-btn" class="next-btn" onclick="startBattleScreen()">
      このアイテムで うでずもう！ 💪
    </button>
  </div>

  <!-- ================= 画面2: うでずもうスタート画面 ================= -->
  <div id="screen-battle" class="screen battle-screen">
    <div class="badge" style="background:#ef4444;">しょうぶ！</div>
    <div class="battle-title">🔥 うでずもう スタート！ 🔥</div>

    <!-- 選んだアイテムの確認カード（画像付き） -->
    <div class="item-activated-box">
      <div class="battle-image-wrapper" id="battle-img-wrap">
        <!-- 選択された画像がここに表示されます -->
      </div>
      <div class="activated-text">
        <div class="activated-badge">はつどうアイテム</div>
        <div id="battle-name" class="activated-name">アイテム名</div>
        <div id="battle-desc" class="activated-desc">アイテムの説明</div>
      </div>
    </div>

    <div class="start-cue">
      💪 「レディー・ゴー！」で たおそう！ 💪
    </div>

    <button class="btn-back" onclick="backToSelect()">
      ↩ もういちど えらぶ
    </button>
  </div>

<script>
  /* ==========================================================
     アイテム設定エリア
     画像を用意したら、image: "ファイル名" に書き換えてください。
     （例: image: "stop3.png"）
     ※画像がない場合は自動的に絵文字アイコンが表示されます。
  ========================================================== */
  const items = [
    {
      name: "3びょうていし",
      desc: "あいては 3びょう うごけない！",
      image: "item1.png", // 例: "item1.png"
      fallbackIcon: "⏱️"
    },
    {
      name: "ひとさし指だけ",
      desc: "あいては ゆび1ぽんで しょうぶ！",
      image: "item2.png", // 例: "item2.png"
      fallbackIcon: "☝️"
    },
    {
      name: "スタートいちへんこう",
      desc: "すこし たおした じょうたいで スタート！",
      image: "item3.png", // 例: "item3.png"
      fallbackIcon: "📐"
    }
  ];

  /* 画像描画ヘルパー関数 */
  function renderItemMedia(item, targetElement, isLarge = false) {
    targetElement.innerHTML = "";
    if (item.image && item.image.trim() !== "") {
      const img = document.createElement("img");
      img.src = item.image;
      img.alt = item.name;
      targetElement.appendChild(img);
    } else {
      const span = document.createElement("span");
      span.className = isLarge ? "battle-placeholder-icon" : "placeholder-icon";
      span.textContent = item.fallbackIcon;
      targetElement.appendChild(span);
    }
  }

  // 初期読み込み時に選択画面の3枚に画像/アイコンをセット
  items.forEach((item, index) => {
    const wrap = document.getElementById(`card-img-wrap-${index}`);
    if (wrap) renderItemMedia(item, wrap, false);
  });

  /* 効果音（Web Audio API） */
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'select') {
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.08);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'start') {
      const chords = [523.25, 659.25, 783.99, 1046.5];
      chords.forEach(freq => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'triangle';
        o.frequency.value = freq;
        o.connect(g);
        g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.25, now);
        g.gain.linearRampToValueAtTime(0, now + 0.6);
        o.start(now);
        o.stop(now + 0.6);
      });
    }
  }

  let selectedIndex = -1;

  /* アイテム選択 */
  function selectItem(index) {
    playSound('select');
    selectedIndex = index;

    // 枠線の強調切り替え
    const cards = document.querySelectorAll('.item-card');
    cards.forEach((card, idx) => {
      if (idx === index) {
        card.classList.add('selected');
      } else {
        card.classList.remove('selected');
      }
    });

    document.getElementById('start-btn').style.display = 'block';
  }

  /* うでずもうスタート画面へ遷移 */
  function startBattleScreen() {
    if (selectedIndex === -1) return;
    playSound('start');

    const item = items[selectedIndex];

    // スタート画面に【画像】とテキストを反映
    const battleWrap = document.getElementById('battle-img-wrap');
    renderItemMedia(item, battleWrap, true);

    document.getElementById('battle-name').textContent = item.name;
    document.getElementById('battle-desc').textContent = item.desc;

    document.getElementById('screen-select').classList.remove('active');
    document.getElementById('screen-battle').classList.add('active');
  }

  /* もう一度選ぶ（戻る） */
  function backToSelect() {
    playSound('select');
    document.getElementById('screen-battle').classList.remove('active');
    document.getElementById('screen-select').classList.add('active');
  }
</script>
</body>
</html>
